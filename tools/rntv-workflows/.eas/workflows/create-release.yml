# Start this workflow with src/start-release.ts, which sets the version and
# checks what already exists on GitHub and npm.
name: Create RNTV release
run_name: "${{ inputs.dry_run ? 'Dry run' : 'Create' }} RNTV release ${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      run_id:
        type: string
        required: true
        description: ID of a successful run-release-builds.yml run
      version:
        type: string
        required: true
        description: The version the run built, such as 0.89.0-0rc2
      npm_tag:
        type: string
        required: false
        description: npm dist-tag (default next for a prerelease, <major>.<minor>-stable otherwise)
      latest:
        type: boolean
        default: false
        description: Mark the GitHub release as Latest, and list the npm latest tag as a step after approval (stable versions only)
      draft:
        type: boolean
        default: false
        description: Create the GitHub release as a draft
      dry_run:
        type: boolean
        default: false
        description: Stage and create nothing; show what would happen
      stage_from_github_release:
        type: boolean
        default: false
        description: Skip the GitHub release, and stage the npm packages from its assets

defaults:
  tools:
    node: 24.13.0

jobs:
  github_release:
    name: Create GitHub release
    if: ${{ !inputs.stage_from_github_release }}
    runs_on: linux-medium
    image: latest
    env:
      RUN_ID: ${{ inputs.run_id }}
      VERSION: ${{ inputs.version }}
      LATEST: ${{ toJSON(inputs.latest) }}
      DRAFT: ${{ toJSON(inputs.draft) }}
      DRY_RUN: ${{ toJSON(inputs.dry_run) }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Install EAS CLI and GitHub CLI
        run: |
          set -euo pipefail
          npm install -g eas-cli@27.10.0
          ./scripts/install-gh.sh
      - name: Create GitHub release
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          args=(github-release "$RUN_ID" --version "$VERSION")
          [ "$LATEST" = "true" ] && args+=(--latest)
          [ "$DRAFT" = "true" ] && args+=(--draft)
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          npx tsx ./src/release-workflow-run.ts "${args[@]}"

  npm_stage:
    name: Stage npm packages
    after: [github_release]
    if: ${{ after.github_release.status == 'success' || inputs.stage_from_github_release }}
    runs_on: linux-medium
    image: latest
    env:
      RUN_ID: ${{ inputs.run_id }}
      VERSION: ${{ inputs.version }}
      NPM_TAG: ${{ inputs.npm_tag || '' }}
      LATEST: ${{ toJSON(inputs.latest) }}
      DRY_RUN: ${{ toJSON(inputs.dry_run) }}
      FROM_GITHUB_RELEASE: ${{ toJSON(inputs.stage_from_github_release) }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Install npm, EAS CLI and GitHub CLI
        run: |
          set -euo pipefail
          npm install -g npm@11.21.2 eas-cli@27.10.0
          ./scripts/install-gh.sh
      - name: Stage npm packages
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          args=(npm-stage "$RUN_ID" --version "$VERSION")
          [ -n "$NPM_TAG" ] && args+=(--npm-tag "$NPM_TAG")
          [ "$FROM_GITHUB_RELEASE" = "true" ] && args+=(--from-github-release)
          [ "$LATEST" = "true" ] && args+=(--latest)
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          npx tsx ./src/release-workflow-run.ts "${args[@]}"
